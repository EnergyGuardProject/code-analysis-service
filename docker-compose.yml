version: '3.8'
services:
  sonarqube:
    image: sonarqube:10.5-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
      - SONARQUBE_ADMIN_PASS=MyStrongSecurePassword! # ...
    depends_on:
      - db
    networks:
      - sonarqube_network

  db:
    image: postgres:15
    container_name: sonarqube_db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - sonarqube_network

  scanner_api:
    build: ./sonar-api-demo
    container_name: sonar_api
    ports:
      - "5000:5000"
    volumes:
      - ./sonar-api-demo:/app
    environment:
      - SONARQUBE_URL=http://sonarqube:9000
      - SONAR_SCANNER_PATH=/usr/bin/sonar-scanner
      - SONARQUBE_ADMIN_PASS=MyStrongSecurePassword! # ...
    depends_on:
      - sonarqube
    networks:
      - sonarqube_network
    
volumes:
  sonarqube_db_data:

networks:
  sonarqube_network:
    external: true