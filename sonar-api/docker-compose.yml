services:
  scanner_api:
    build: .
    container_name: sonar_api
    environment:
      - SONARQUBE_URL=${SONARQUBE_URL:-http://sonarqube:9000}
      - SONARQUBE_TOKEN=${SONARQUBE_TOKEN}
    ports:
      - "9001:5000"
    networks:
      - sonarqube_network
    volumes:
      - .:/app

networks:
  sonarqube_network:
    external: true
