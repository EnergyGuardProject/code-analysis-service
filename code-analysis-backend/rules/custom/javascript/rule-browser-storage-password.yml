# Original rule of this project (not derived from other rule sets).
rules:
- id: custom_js_browser-storage-password
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: |
    A password is written to the browser storage (`localStorage` or `sessionStorage`). Anything stored there is
    readable in clear text by every script running on the page (including a single injected XSS payload), by
    browser extensions and by anyone with access to the device.

    To remediate this issue, never store the password: keep it only in memory while the user types it, and store
    a short-lived access token instead (preferably in an `HttpOnly` cookie set by the server).
  metadata:
    cwe: "CWE-312"
    category: "security"
    shortDescription: "Cleartext storage of sensitive information"
    owasp:
    - "A02:2021-Cryptographic Failures"
    security-severity: "High"
    confidence: "HIGH"
    references:
    - "https://cwe.mitre.org/data/definitions/312.html"
  patterns:
  - pattern-either:
    - pattern: localStorage.setItem($K, <... $V ...>)
    - pattern: sessionStorage.setItem($K, <... $V ...>)
    - pattern: window.localStorage.setItem($K, <... $V ...>)
    - pattern: window.sessionStorage.setItem($K, <... $V ...>)
  - metavariable-regex:
      metavariable: $V
      regex: (?i)^(.*[._])?(password|passwd|pwd)$
