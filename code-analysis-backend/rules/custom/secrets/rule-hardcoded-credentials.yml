# Original rule of this project (not derived from other rule sets).
# One rule per language family because the assignment syntax differs.
rules:
- id: custom_secrets_hardcoded-credentials
  languages:
  - python
  severity: WARNING
  message: |
    A password, secret or key is written directly in the source code. Anyone who can read the code (or its git
    history) can read it, and it cannot be changed without a new release.

    To remediate this issue, remove the value from the code and rotate it (it is exposed now), then read it from
    an environment variable or a secret manager at run time.
  metadata:
    cwe: "CWE-798"
    category: "security"
    shortDescription: "Use of hard-coded credentials"
    owasp:
    - "A07:2021-Identification and Authentication Failures"
    security-severity: "Medium"
    confidence: "MEDIUM"
    references:
    - "https://cwe.mitre.org/data/definitions/798.html"
  patterns:
  - pattern-either:
    - pattern: '$VAR = "$VAL"'
    - pattern: '$OBJ.$VAR = "$VAL"'
    - pattern: '$F(..., $VAR="$VAL", ...)'
    - pattern: '{..., "$VAR": "$VAL", ...}'
  - metavariable-regex:
      metavariable: $VAR
      regex: (?i)^.*(password|passwd|pwd|secret|api_?key|access_?token|auth_?token|private_?key|client_?secret)$
  - metavariable-regex:
      metavariable: $VAL
      regex: (?i)^(?!.*(change.?me|example|your[-_ ]|placeholder|dummy|sample|redacted|xxx|\*\*\*|\.\.\.|todo|none|null|true|false|password|secret|token|<|>|\{|\}|\$|%)).{6,}$
