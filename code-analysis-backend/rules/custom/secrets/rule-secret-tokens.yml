# SPDX-License-Identifier: AGPL-3.0-or-later
# Original rule of this project (not derived from other rule sets). The patterns describe the publicly documented
# formats of each provider's keys. Raw notebooks (*.ipynb) are excluded: their code cells are scanned after the
# backend converts them to source files, which gives a cell number instead of a JSON line.
rules:
- id: custom_secrets_cloud-provider-key
  languages:
  - regex
  severity: ERROR
  message: |
    This text looks like an access key of a cloud provider (AWS access key ID, Google API key). Keys committed to a
    repository must be treated as leaked, even if the repository is private.

    To remediate this issue, revoke or rotate the key now, remove it from the code and from the git history, and
    load it from an environment variable or a secret manager instead.
  metadata:
    cwe: "CWE-798"
    category: "security"
    shortDescription: "Use of hard-coded credentials"
    owasp:
    - "A07:2021-Identification and Authentication Failures"
    security-severity: "High"
    confidence: "HIGH"
    references:
    - "https://cwe.mitre.org/data/definitions/798.html"
  paths:
    exclude:
    - "*.lock"
    - "package-lock.json"
    - "*.min.js"
    - "*.ipynb"
  pattern-regex: |-
    \b(?:AKIA|ASIA)[0-9A-Z]{16}\b|\bAIza[0-9A-Za-z_\-]{35}\b
- id: custom_secrets_service-token
  languages:
  - regex
  severity: ERROR
  message: |
    This text looks like an access token of an online service (GitHub, Slack, Stripe or SonarQube). Tokens committed to a
    repository must be treated as leaked, even if the repository is private.

    To remediate this issue, revoke the token now, remove it from the code and from the git history, and load it
    from an environment variable or a secret manager instead.
  metadata:
    cwe: "CWE-798"
    category: "security"
    shortDescription: "Use of hard-coded credentials"
    owasp:
    - "A07:2021-Identification and Authentication Failures"
    security-severity: "High"
    confidence: "HIGH"
    references:
    - "https://cwe.mitre.org/data/definitions/798.html"
  paths:
    exclude:
    - "*.lock"
    - "package-lock.json"
    - "*.min.js"
    - "*.ipynb"
  pattern-regex: |-
    \bgh[pousr]_[A-Za-z0-9]{36,255}\b|\bgithub_pat_[A-Za-z0-9_]{60,}\b|\bxox[abprs]-[A-Za-z0-9-]{10,}\b|\b[sr]k_live_[0-9a-zA-Z]{24,}\b|\bsq[uapb]_[0-9a-f]{40}\b
- id: custom_secrets_private-key
  languages:
  - regex
  severity: ERROR
  message: |
    A private key is stored in this file. Anyone who can read the repository can impersonate its owner.

    To remediate this issue, treat the key as leaked: replace it, remove the file from the code and from the git
    history, and keep keys in a secret manager.
  metadata:
    cwe: "CWE-321"
    category: "security"
    shortDescription: "Use of hard-coded cryptographic key"
    owasp:
    - "A02:2021-Cryptographic Failures"
    security-severity: "High"
    confidence: "HIGH"
    references:
    - "https://cwe.mitre.org/data/definitions/321.html"
  paths:
    exclude:
    - "*.lock"
    - "package-lock.json"
    - "*.min.js"
    - "*.ipynb"
  pattern-regex: |-
    -----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED |PGP )?PRIVATE KEY(?: BLOCK)?-----
- id: custom_secrets_url-with-credentials
  languages:
  - regex
  severity: WARNING
  message: |
    A URL contains a user name and password (`scheme://user:password@host`). Anyone who can read the code can
    read the credentials, and URLs tend to end up in logs and error messages.

    To remediate this issue, remove the credentials from the URL, rotate the password, and pass them separately
    through environment variables or a secret manager.
  metadata:
    cwe: "CWE-798"
    category: "security"
    shortDescription: "Use of hard-coded credentials"
    owasp:
    - "A07:2021-Identification and Authentication Failures"
    security-severity: "Medium"
    confidence: "MEDIUM"
    references:
    - "https://cwe.mitre.org/data/definitions/798.html"
  paths:
    exclude:
    - "*.lock"
    - "package-lock.json"
    - "*.min.js"
    - "*.ipynb"
  pattern-regex: |-
    \b[a-z][a-z0-9+.\-]*://[^\s/:@<>{}$'"`\\]+:[^\s/@<>{}$'"`\\]{3,}@[^\s/'"`\\]+
