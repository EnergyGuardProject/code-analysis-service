services:
  sonarqube:
    image: sonarqube:10.5-community  # pin version for stability
    restart: always
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
      - SONARQUBE_ADMIN_PASS=MyStrongSecurePassword!
    depends_on:
      - db
    networks:
      - sonarqube_network
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions

  db:
    image: postgres:15
    container_name: sonarqube_db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    networks:
      - sonarqube_network

volumes:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:

networks:
  sonarqube_network:
    external: true